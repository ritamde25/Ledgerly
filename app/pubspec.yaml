name: app
description: "Digitizing the traditional udhaar/khata system with a mobile app that enables shopkeepers to efficiently track credit transactions, reduce errors, and streamline billing."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2

  drift: ^2.28.1
  sqlite3_flutter_libs: ^0.6.0+eol

  path_provider: ^2.1.5
  path: ^1.9.1

  supabase_flutter: ^2.9.1

  json_annotation: ^4.9.0

  flutter_native_splash: ^2.4.6

  uuid: ^4.5.1
  flutter_dotenv: ^6.0.1

  url_launcher: ^6.3.2

  csv: ^8.0.0

  file_picker: ^12.0.0-beta.7

  share_plus: ^13.2.0

  camera: ^0.12.0+1

  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  drift_dev: ^2.28.1
  build_runner: ^2.7.1
  json_serializable: ^6.11.0

  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/icons/ledger-ico.png
  min_sdk_android: 24

  adaptive_icon_background: "#F9FAFB"
  adaptive_icon_foreground: assets/icons/ledger-ico.png

flutter:
  uses-material-design: true

  assets:
    - .env